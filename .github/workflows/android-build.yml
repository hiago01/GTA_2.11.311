name: GTA 2.11.311 - Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - teste-original

permissions:
  contents: read

concurrency:
  group: gta-2.11.311-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove app release and debug folders
        run: |
          echo "========================================"
          echo "       REMOVING OLD APP FOLDERS"
          echo "========================================"

          rm -rf app/release/
          rm -rf app/debug/

          echo ""
          echo "===== CHECK AFTER REMOVAL ====="

          if [ -d "app/release" ]; then
            echo "WARNING: app/release/ ainda existe."
          else
            echo "OK: app/release/ foi removida."
          fi

          if [ -d "app/debug" ]; then
            echo "WARNING: app/debug/ ainda existe."
          else
            echo "OK: app/debug/ foi removida."
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "===== ENVIRONMENT ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID SDK ====="
          ls -la "$ANDROID_HOME"

          echo "===== NDK ====="
          ls -la "$ANDROID_HOME/ndk"

          echo "===== CMAKE ====="
          ls -la "$ANDROID_HOME/cmake"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: |
          ./gradlew --version --daemon

      - name: Clean project
        run: |
          echo "========================================"
          echo "          CLEANING PROJECT"
          echo "========================================"

          ./gradlew clean \
            --stacktrace \
            --daemon \
            --info

      - name: Verify folders after Gradle clean
        run: |
          echo "========================================"
          echo "       FOLDERS AFTER GRADLE CLEAN"
          echo "========================================"

          if [ -d "app/release" ]; then
            echo "app/release/ exists."
          else
            echo "app/release/ does not exist."
          fi

          if [ -d "app/debug" ]; then
            echo "app/debug/ exists."
          else
            echo "app/debug/ does not exist."
          fi

      - name: Verify release keystore
        run: |
          echo "========================================"
          echo "          RELEASE KEYSTORE"
          echo "========================================"

          ls -lh app/keystore/gta-release.jks

          keytool -list \
            -keystore app/keystore/gta-release.jks \
            -storepass hiago123

      - name: Check duplicate baseline profiles
        run: |
          echo "========================================"
          echo "          BASELINE PROFILE CHECK"
          echo "========================================"

          find app/src/main/assets \
            -type f \
            \( -name "baseline.prof" -o -name "baseline.profm" \) \
            -print 2>/dev/null || true

      - name: Build Release APK
        run: |
          echo "========================================"
          echo "          BUILDING RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --stacktrace \
            --daemon \
            --info

      - name: Check newly created app folders
        if: always()
        run: |
          echo "========================================"
          echo "       CHECKING CREATED APP FOLDERS"
          echo "========================================"

          echo ""
          echo "===== app/release ====="

          if [ -d "app/release" ]; then
            echo "NEW app/release/ CREATED"

            find app/release \
              -maxdepth 2 \
              -type f \
              -print
          else
            echo "app/release/ was NOT created."
          fi

          echo ""
          echo "===== app/debug ====="

          if [ -d "app/debug" ]; then
            echo "NEW app/debug/ CREATED"

            find app/debug \
              -maxdepth 2 \
              -type f \
              -print
          else
            echo "app/debug/ was NOT created."
          fi

      - name: Verify APK signature
        if: success()
        run: |
          echo "========================================"
          echo "          VERIFYING APK SIGNATURE"
          echo "========================================"

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK não encontrado:"
            echo "$APK"
            exit 1
          fi

          echo "APK: $APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$APK"

      - name: Find generated APK
        if: always()
        run: |
          echo "========================================"
          echo "          GENERATED APK FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "========================================"
          echo "          GENERATED AAB"
          echo "========================================"

          find . \
            -type f \
            -name "*.aab" \
            -print

          echo ""
          echo "========================================"
          echo "          GRADLE RELEASE OUTPUT"
          echo "========================================"

          ls -lah app/build/outputs/apk/release/ 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "          APP/RELEASE OUTPUT"
          echo "========================================"

          ls -lah app/release/ 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "          APP/DEBUG OUTPUT"
          echo "========================================"

          ls -lah app/debug/ 2>/dev/null || true

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-release
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload app/release APK if created
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-app-release
          path: |
            app/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload app/debug APK if created
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-app-debug
          path: |
            app/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-release-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
