name: GTA 2.11.311 - Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - XS

  pull_request:
    branches:
      - XS

permissions:
  contents: read

concurrency:
  group: gta-2.11.311-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64


      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # ANDROID COMPONENTS
      # ==========================================================

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"


      # ==========================================================
      # ENVIRONMENT
      # ==========================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo "CMake:"
          ls -la "$ANDROID_HOME/cmake"


      # ==========================================================
      # GRADLE
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3


      - name: Make Gradle executable
        run: chmod +x ./gradlew


      - name: Show Gradle information
        run: |
          ./gradlew --version


      # ==========================================================
      # PROJECT INFORMATION
      # ==========================================================

      - name: Show project structure
        run: |
          echo "===== PROJECT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort \
            | head -300


      # ==========================================================
      # GRADLE TASKS
      # ==========================================================

      - name: Check Gradle tasks
        run: |
          ./gradlew tasks --stacktrace


      # ==========================================================
      # DEBUG BUILD
      # ==========================================================

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # LIST OUTPUT
      # ==========================================================

      - name: Find generated APKs
        if: always()
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo "===== AAB FILES ====="

          find . \
            -type f \
            -name "*.aab" \
            -print


      # ==========================================================
      # UPLOAD DEBUG APK
      # ==========================================================

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # UPLOAD BUILD LOGS
      # ==========================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-build-logs
          path: |
            **/build/outputs/logs/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
