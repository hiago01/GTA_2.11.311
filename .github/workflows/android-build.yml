name: GTA 2.11.311 - Android Release

on:
  workflow_dispatch:

  push:
    branches:
      - teste-original

permissions:
  contents: read

concurrency:
  group: gta-2.11.311-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teste-original
          fetch-depth: 1

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # ANDROID SDK / NDK / CMAKE
      # ============================================================

      - name: Install Android components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      # ============================================================
      # ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean
        run: |
          ./gradlew clean --stacktrace

      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find generated APK
        run: |
          echo "========================================"
          echo "          SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      # ============================================================
      # PREPARE APK FOR UPLOAD
      # ============================================================

      - name: Prepare APK
        run: |
          mkdir -p artifact

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" artifact/GTA-2.11.311-release.apk

          echo ""
          echo "APK preparado:"
          ls -lh artifact/GTA-2.11.311-release.apk

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-release
          path: artifact/GTA-2.11.311-release.apk
          if-no-files-found: error
          retention-days: 7
