name: GTA 2.11.311 - Android Debug Test

on:
  workflow_dispatch:
  push:
    branches:
      - XS

permissions:
  contents: read

concurrency:
  group: gta-2.11.311-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          echo "===== ANDROID SDK ====="
          ls -la "$ANDROID_HOME"

          echo "===== NDK ====="
          ls -la "$ANDROID_HOME/ndk"

          echo "===== CMAKE ====="
          ls -la "$ANDROID_HOME/cmake"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Clean project
        run: |
          echo "===== CLEANING PROJECT ====="

          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Verify clean output
        run: |
          echo "===== BUILD DIRECTORIES AFTER CLEAN ====="

          find app/build -maxdepth 3 -type d -print 2>/dev/null || true

          echo "===== OLD APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Build Debug APK
        run: |
          echo "===== BUILDING DEBUG APK ====="

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --info

      - name: Find generated APK
        if: always()
        run: |
          echo "========================================"
          echo "          GENERATED DEBUG APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "========================================"
          echo "          GENERATED AAB"
          echo "========================================"

          find . \
            -type f \
            -name "*.aab" \
            -print

          echo ""
          echo "========================================"
          echo "          APK DIRECTORY"
          echo "========================================"

          ls -lah app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-debug-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
