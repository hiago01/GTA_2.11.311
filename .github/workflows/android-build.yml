name: GTA 2.11.311 - Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - XS

permissions:
  contents: read

concurrency:
  group: gta-2.11.311-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          echo "===== ANDROID SDK ====="
          ls -la "$ANDROID_HOME"

          echo "===== NDK ====="
          ls -la "$ANDROID_HOME/ndk"

          echo "===== CMAKE ====="
          ls -la "$ANDROID_HOME/cmake"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find generated APK
        if: always()
        run: |
          echo "===== GENERATED APK ====="
          find . -type f -name "*.apk" -print

          echo "===== GENERATED AAB ====="
          find . -type f -name "*.aab" -print

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-release
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11.311-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
